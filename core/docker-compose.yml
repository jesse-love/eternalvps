networks:
  eternal-network:
    name: eternal-network # Explicitly name the network
    driver: bridge

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yaml run
    volumes:
      - ./config.yaml:/etc/cloudflared/config.yaml:ro
      - ./credentials.json:/etc/cloudflared/credentials.json:ro
    networks:
      - eternal-network

  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    networks:
      - eternal-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.eternalservices.ca`)"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.routers.traefik.service=api@internal"
      # This middleware is defined in the Portainer service, but we declare it here for clarity
      - "traefik.http.middlewares.https-headers.headers.customRequestHeaders.X-Forwarded-Proto=https"

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    networks:
      - eternal-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.eternalservices.ca`)"
      - "traefik.http.routers.portainer.middlewares=https-headers@docker"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=n8n.eternalservices.ca
      - N8N_PORT=5678
      - WEBHOOK_URL=https://n8n.eternalservices.ca/
      - GENERIC_TIMEZONE=America/New_York
      - TZ=America/New_York
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=n8nuser
      - N8N_BASIC_AUTH_PASSWORD=12b10c1ee9dd8d3f24a571d110df8fe5
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=790f51e64cf94a0f4b74f0ac68860488
    volumes:
      - ../apps/n8n/n8n_data:/home/node/.n8n
    networks:
      - eternal-network
    depends_on:
      - n8n-db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.eternalservices.ca`)"
      - "traefik.http.routers.n8n.entrypoints=web"
      - "traefik.http.routers.n8n.middlewares=https-headers@docker"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

  n8n-db:
    image: postgres:13
    container_name: n8n-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=790f51e64cf94a0f4b74f0ac68860488
    volumes:
      - ../apps/n8n/postgres_data:/var/lib/postgresql/data
    networks:
      - eternal-network

  # --- HUB (Landing Page) ---
  hub:
    build: ../apps/hub
    container_name: hub
    restart: unless-stopped
    networks:
      - eternal-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hub.rule=Host(`hub.eternalservices.ca`) || Host(`eternalservices.ca`)"
      - "traefik.http.routers.hub.entrypoints=web"
      - "traefik.http.routers.hub.middlewares=https-headers@docker"
      - "traefik.http.services.hub.loadbalancer.server.port=80"

  # --- MATTERMOST (Team Chat) ---
  mattermost:
    image: mattermost/mattermost-team-edition:release-8.1
    container_name: mattermost
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    read_only: false
    tmpfs:
      - /tmp
    volumes:
      - ../apps/mattermost/config:/mattermost/config:rw
      - ../apps/mattermost/data:/mattermost/data:rw
      - ../apps/mattermost/logs:/mattermost/logs:rw
      - ../apps/mattermost/plugins:/mattermost/plugins:rw
      - ../apps/mattermost/client/plugins:/mattermost/client/plugins:rw
      - /etc/localtime:/etc/localtime:ro
    environment:
      - MM_SQLSETTINGS_DRIVERNAME=postgres
      - MM_SQLSETTINGS_DATASOURCE=postgres://mmuser:mmuser_password@mattermost-db:5432/mattermost?sslmode=disable&connect_timeout=10
      - MM_BLEVESTTINGS_INDEXDIR=/mattermost/bleve-indexes
      - MM_SERVICESETTINGS_SITEURL=https://chat.eternalservices.ca
    networks:
      - eternal-network
    depends_on:
      - mattermost-db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mattermost.rule=Host(`chat.eternalservices.ca`)"
      - "traefik.http.routers.mattermost.entrypoints=web"
      - "traefik.http.routers.mattermost.middlewares=https-headers@docker"
      - "traefik.http.services.mattermost.loadbalancer.server.port=8065"

  mattermost-db:
    image: postgres:15-alpine
    container_name: mattermost-db
    restart: unless-stopped
    volumes:
      - ../apps/mattermost/db_data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - POSTGRES_USER=mmuser
      - POSTGRES_PASSWORD=mmuser_password
      - POSTGRES_DB=mattermost
    networks:
      - eternal-network

volumes:
  portainer_data:
